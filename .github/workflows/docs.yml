name: Documentation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python scripts/check_docs.py
      - name: Validate P0 source fixture
        run: |
          python scripts/check_truth_packet.py
          python -m unittest discover -s tests/validation -p "test_*.py" -v
      - name: Validate repository skills
        run: python -m unittest discover -s tests/skills -p "test_*.py" -v
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate P0 source fixture on Windows
        run: |
          python scripts/check_truth_packet.py
          python -m unittest discover -s tests/validation -p "test_*.py" -v
  portable-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Check the publication input and artifact regressions first
        run: >-
          python -m unittest
          tests.application.test_tui.EscapeSuffixTests
          tests.application.test_tui_terminal.TerminalProcessTests.test_modified_keys_and_pasted_control_bytes_never_become_commands
          tests.application.test_source_artifact.SourceArtifactTests.test_reproducible_runtime_inventory_and_isolated_launch
      - name: Verify personal alpha including portable contracts, PTY and source extraction
        run: python scripts/verify.py --scope alpha --scope harness --temp-root "$RUNNER_TEMP"
      - name: Preserve portable ingress and context security regression
        run: python -m unittest discover -s tests/security -t . -p "test_*.py" -v
      - name: Build and run the independent personal alpha
        run: |
          python -m scripts.build_source --output "$RUNNER_TEMP/claimbranch-source.zip"
          python -m scripts.check_source_artifact "$RUNNER_TEMP/claimbranch-source.zip"
  relay-regression:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Check owned relay startup and stream boundaries
        run: python -m unittest tests.application.test_codex_relay.CodexRelayTests
