name: Documentation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python scripts/check_docs.py
      - name: Validate P0 source fixture
        run: |
          python scripts/check_truth_packet.py
          python -m unittest discover -s tests/validation -p "test_*.py" -v
      - name: Validate repository skills
        run: python -m unittest discover -s tests/skills -p "test_*.py" -v
  windows-validation:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Validate P0 source fixture on Windows
        run: |
          python scripts/check_truth_packet.py
          python -m unittest discover -s tests/validation -p "test_*.py" -v
