<script>
(() => {
  const scenes = [...document.querySelectorAll('.scene')];
  const links = [...document.querySelectorAll('nav a')];
  function show(focus) {
    const selected = scenes.find(scene => '#' + scene.id === location.hash) || scenes[0];
    scenes.forEach(scene => scene.hidden = scene !== selected);
    links.forEach(link => {
      if (link.getAttribute('href') === '#' + selected.id) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
    if (focus) selected.querySelector('h2').focus({preventScroll:true});
  }
  window.addEventListener('hashchange', () => show(true));
  document.getElementById('layout').addEventListener('change', event => {
    document.body.classList.toggle('compact', event.target.value === 'compact');
  });
  show(false);
})();
</script>
