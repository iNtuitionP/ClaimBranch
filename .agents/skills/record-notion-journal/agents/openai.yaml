interface:
  display_name: "Record Notion Journal"
  short_description: "Safely sync one ClaimBranch journal entry"
  default_prompt: "Use $record-notion-journal to sync the pending ClaimBranch journal entry."

dependencies:
  tools:
    - type: "mcp"
      value: "notion"
      description: "Official Notion MCP server configured for the ClaimBranch journal"
      transport: "streamable_http"
      url: "https://mcp.notion.com/mcp"

policy:
  allow_implicit_invocation: true
